<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的行迹</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#253c33;font:15px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:850px;margin:auto;padding:18px 18px 100px}header{background:#19372e;color:#eee6d2;padding:30px 24px;border-radius:24px}h1{font-size:36px;margin:8px 0;font-family:serif}h2{font-size:21px;margin:24px 0 12px}small,.muted{color:#77847a}header small{color:#b6c5b6;letter-spacing:3px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd2c5;background:#fffdf7;color:#254337;padding:10px 14px;border-radius:12px}button.active,.primary{background:#31594a;color:white;border-color:#31594a}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile,article{background:#fffdf8;border:1px solid #e2dfd4;border-radius:16px;padding:16px;margin-bottom:10px}.num{font-size:32px;font-weight:600;display:block}.tag{display:inline-block;background:#e8ede4;border-radius:20px;padding:3px 10px;margin:3px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;display:flex;justify-content:center;gap:5px;padding:10px 5px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{border:0;font-size:13px;padding:10px}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;background:white;margin:5px 0 12px}label{display:block}img{max-width:100%;border-radius:10px}details{margin:8px 0}summary{cursor:pointer}a{color:#346b58} .danger{color:#9a463a} .route{border-left:2px solid #b5c6b5;padding-left:18px;margin-left:8px} .route article{position:relative}.route article:before{content:'';position:absolute;left:-25px;top:24px;background:#648f75;width:12px;height:12px;border-radius:50%}</style><main><header><small>ATLAS OF LIFE / VOL. 01</small><h1>我的行迹</h1>以旅行丈量世界，以时间收藏记忆。<div id="hero"></div></header><div class="tabs" id="members"></div><div id="view"></div></main><nav id="nav"></nav><script>
const D=['自然','文明','生命','味觉'],M=JSON.parse(localStorage.getItem('atlas-member-labels')||'["我","孩子","伴侣"]'),C=['#648f75','#ba9561','#639ba5','#c17e68'];let db={version:1,trips:[]},filter='全部',page='首页';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let store;const req=indexedDB.open('world-atlas-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>{store=req.result;const q=store.transaction('data').objectStore('data').get('db');q.onsuccess=()=>{if(q.result)db=q.result;render()}};req.onerror=()=>{alert('本地存储不可用，请及时导出备份');render()};function save(){if(store){const t=store.transaction('data','readwrite');t.objectStore('data').put(db,'db');t.onerror=()=>alert('保存失败，请导出备份')}render()}
function selected(t,r){let m=r.members??t.members;return filter==='全部'||(filter==='一家三口'?M.every(x=>m.includes(x)):m.includes(filter))}function rows(){return db.trips.flatMap(t=>t.records.filter(r=>selected(t,r)).map(r=>({t,r})))}function tags(rs,d){return [...new Set(rs.flatMap(x=>x.r.tags).filter(x=>x.startsWith(d+':')).map(x=>x.split(':').slice(1).join(':')))]}function go(p){page=p;render()}function render(){ $('members').innerHTML=['全部',...M,'一家三口'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('');$('nav').innerHTML=['首页','专题','图鉴','录入','管理'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let rs=rows(),v=$('view');$('hero').innerHTML=`<p>${esc(filter)} · ${new Set(rs.map(x=>x.t.id)).size} 个旅行章节</p>`;if(page==='首页'){v.innerHTML=`<h2>世界足迹</h2><div class="grid">${[['到访地点',new Set(rs.map(x=>x.r.place)).size],['体验记录',rs.length],['已核实名录',new Set(rs.flatMap(x=>x.r.heritage||[])).size],['旅行专题',new Set(rs.map(x=>x.t.id)).size]].map(x=>`<div class="tile"><span class="num">${x[1]}</span>${x[0]}</div>`).join('')}</div><h2>认识世界</h2><div class="grid">${D.map((d,i)=>`<div class="tile" style="border-top:4px solid ${C[i]}"><span class="num">${tags(rs,d).length}</span>${d}认知<br><small>${esc(tags(rs,d).slice(0,3).join(' · '))}</small></div>`).join('')}</div><h2>人生章节</h2>${tripList(rs)}`;}else if(page==='专题'){v.innerHTML='<h2>旅行专题</h2>'+tripList(rs)}else if(page==='图鉴'){v.innerHTML='<h2>知识图鉴</h2>'+D.map((d,i)=>`<article><h3 style="color:${C[i]}">${d}认知</h3>${tags(rs,d).map(k=>`<details><summary>${esc(k)}</summary>${rs.filter(x=>x.r.tags.includes(d+':'+k)).map(x=>`<p><b>${esc(x.r.place)}</b> · ${esc(x.r.note)}</p>`).join('')}</details>`).join('')||'暂无记录'}</article>`).join('')+'<h2>体验图鉴</h2>'+[...new Set(rs.flatMap(x=>x.r.activities))].map(a=>`<article><details><summary>${esc(a)} · ${rs.filter(x=>x.r.activities.includes(a)).length}次记录</summary>${rs.filter(x=>x.r.activities.includes(a)).map(x=>`<p>${esc(x.r.place)} · ${esc(x.r.note)}</p>`).join('')}</details></article>`).join('')}else if(page==='录入'){form()}else{v.innerHTML=`<h2>数据管理</h2><article><p>家庭成员昵称（仅保存在本机）</p><button onclick="renameMembers()">设置成员昵称</button></article><article><p>数据保存在当前浏览器 IndexedDB 中，不会自动同步。请定期备份。</p><button onclick="exportDB()">导出完整 JSON</button><p>导入 JSON（相同 ID 的专题将替换）</p><input type="file" accept=".json,application/json" onchange="importDB(this)"><p><button class="danger" onclick="if(confirm('清空本地全部数据？')){db.trips=[];save()}">清空本地数据</button></p></article>`}}
function tripList(rs){return db.trips.filter(t=>filter==='全部'||rs.some(x=>x.t===t)).map(t=>`<article><small>${esc(t.date)} · ${esc(t.members.join('、')||'成员待确认')}</small><h3>${esc(t.title)}</h3><p>${esc(t.note)}</p><button onclick="detail('${encodeURIComponent(t.id)}')">查看章节</button> <button onclick="editTrip('${encodeURIComponent(t.id)}')">编辑专题</button></article>`).join('')||'<p class="muted">暂无符合条件的旅行记录。</p>'}function detail(id){let t=db.trips.find(x=>x.id===decodeURIComponent(id));$('view').innerHTML=`<h2>${esc(t.title)}</h2><p>${esc(t.note)}</p><button onclick="form('${id}')">添加体验</button> <button onclick="render()">返回</button><div class="route">${t.records.filter(r=>selected(t,r)).map(r=>`<article><h3>${esc(r.place)}</h3><small>${esc((r.members??t.members).join('、')||'成员待确认')}</small><p>${esc(r.note)}</p>${r.tags.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}${r.activities.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}<p>${esc(r.summary)}</p>${(r.links||[]).filter(u=>/^https?:\/\//i.test(u)).map(u=>`<p><a href="${esc(u)}" target="_blank" rel="noopener">参考资料</a></p>`).join('')}${r.photos.filter(u=>/^data:image\//.test(u)).map(u=>`<img src="${esc(u)}">`).join('')}<p><button onclick="form('${id}','${encodeURIComponent(r.id)}')">编辑体验</button></p></article>`).join('')}</div>`}function checks(m){return M.map(x=>`<label style="display:inline-block;margin:8px"><input type="checkbox" name="member" value="${x}" ${m.includes(x)?'checked':''}> ${x}</label>`).join('')}function picked(){return [...document.querySelectorAll('[name=member]:checked')].map(x=>x.value)}function editTrip(id){let t=db.trips.find(x=>x.id===decodeURIComponent(id));$('view').innerHTML=`<h2>编辑专题</h2><input id="tt" value="${esc(t.title)}"><input id="dt" value="${esc(t.date)}"><textarea id="nt">${esc(t.note)}</textarea>${checks(t.members)}<p><button class="primary" id="st">保存</button></p>`;$('st').onclick=()=>{t.title=$('tt').value;t.date=$('dt').value;t.note=$('nt').value;t.members=picked();save();detail(id)}}
function form(id,rid){let t=db.trips.find(x=>x.id===decodeURIComponent(id||'')),r=t?.records.find(x=>x.id===decodeURIComponent(rid||''));$('view').innerHTML=`<h2>${r?'编辑体验':'新增旅行体验'}</h2><label>旅行专题</label><select id="trip"><option value="">新建专题</option>${db.trips.map(x=>`<option value="${esc(x.id)}" ${t===x?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label>新专题名称（仅新建时）</label><input id="tt"><label>日期</label><input id="dt" type="date" value="${esc(r?.date||'')}"><label>地点</label><input id="pl" value="${esc(r?.place)}"><label>参与成员</label>${checks(r?.members??t?.members??[])}<label>体验与感悟</label><textarea id="nt">${esc(r?.note)}</textarea><label>知识标签（逗号分隔，如 自然:雪山,文明:古道）</label><input id="tg" value="${esc(r?.tags.join(','))}"><label>活动（逗号分隔）</label><input id="ac" value="${esc(r?.activities.join(','))}"><label>百科摘要</label><textarea id="su">${esc(r?.summary)}</textarea><label>参考链接（每行一个）</label><textarea id="li">${esc(r?.links?.join('\n'))}</textarea><label>已核实官方名录（逗号分隔）</label><input id="he" value="${esc(r?.heritage?.join(','))}"><label>添加照片</label><input id="ph" type="file" accept="image/*" multiple><button class="primary" id="sv">保存记录</button>${r?'<button class="danger" id="del">删除体验</button>':''}`;if(r)$('del').onclick=()=>{if(confirm('删除该体验？')){t.records=t.records.filter(x=>x!==r);save();detail(id)}};$('sv').onclick=async()=>{if(!$('pl').value.trim())return alert('请输入地点');let dest=db.trips.find(x=>x.id===$('trip').value);if(!dest&&!$('tt').value.trim())return alert('请输入专题名称');let split=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);let photos=[...(r?.photos||[])];try{for(let f of $('ph').files)photos.push(await new Promise((ok,no)=>{let fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(f)}))}catch(e){return alert('照片读取失败')}if(!dest){dest={id:crypto.randomUUID?.()||String(Date.now()),title:$('tt').value,date:$('dt').value,members:picked(),note:'',records:[]};db.trips.push(dest)}let item={id:r?.id||crypto.randomUUID?.()||String(Date.now()),date:$('dt').value,place:$('pl').value,note:$('nt').value,members:picked(),tags:split($('tg').value),activities:split($('ac').value),summary:$('su').value,links:$('li').value.split('\n').filter(Boolean),heritage:split($('he').value),photos};if(r)t.records=t.records.filter(x=>x!==r);dest.records.push(item);save();page='专题';render();detail(encodeURIComponent(dest.id))}}
function renameMembers(){let n=M.map(x=>prompt('设置成员昵称',x));if(n.some(x=>!x||!/^\p{L}{1,16}$/u.test(x))||new Set(n).size!==3||n.some(x=>['全部','一家三口'].includes(x)))return alert('请输入三个不同的纯文字昵称');let map=x=>n[M.indexOf(x)]||x;for(let t of db.trips){t.members=t.members.map(map);for(let r of t.records)if(r.members)r.members=r.members.map(map)}M.splice(0,3,...n);localStorage.setItem('atlas-member-labels',JSON.stringify(M));filter='全部';save()}function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='world-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importDB(el){try{let d=JSON.parse(await el.files[0].text());if(d.version!==1||!Array.isArray(d.trips)||!d.trips.every(t=>typeof t.id==='string'&&/^[\w-]+$/.test(t.id)&&typeof t.title==='string'&&Array.isArray(t.members)&&Array.isArray(t.records)&&t.records.every(r=>typeof r.id==='string'&&/^[\w-]+$/.test(r.id)&&typeof r.place==='string'&&['tags','activities','photos','links','heritage'].every(k=>Array.isArray(r[k])&&r[k].every(x=>typeof x==='string'))&&(r.members==null||Array.isArray(r.members)))))throw Error();if(!confirm('导入 '+d.trips.length+' 个专题？相同 ID 将替换。'))return;for(let t of d.trips){db.trips=db.trips.filter(x=>x.id!==t.id);db.trips.push(t)}save();alert('已导入')}catch(e){alert('文件格式不符合 V1 标准')}}render();</script></html>
