<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的行迹</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#253c33;font:15px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:850px;margin:auto;padding:18px 18px 100px}header{background:#19372e;color:#eee6d2;padding:30px 24px;border-radius:24px}h1{font-size:36px;margin:8px 0;font-family:serif}h2{font-size:21px;margin:24px 0 12px}small,.muted{color:#77847a}header small{color:#b6c5b6;letter-spacing:3px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd2c5;background:#fffdf7;color:#254337;padding:10px 14px;border-radius:12px}button.active,.primary{background:#31594a;color:white;border-color:#31594a}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile,article{background:#fffdf8;border:1px solid #e2dfd4;border-radius:16px;padding:16px;margin-bottom:10px}.num{font-size:32px;font-weight:600;display:block}.tag{display:inline-block;background:#e8ede4;border-radius:20px;padding:3px 10px;margin:3px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;display:flex;justify-content:center;gap:5px;padding:10px 5px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{border:0;font-size:13px;padding:10px}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;background:white;margin:5px 0 12px}label{display:block}img{max-width:100%;border-radius:10px}details{margin:8px 0}summary{cursor:pointer}a{color:#346b58} .danger{color:#9a463a} .route{border-left:2px solid #b5c6b5;padding-left:18px;margin-left:8px} .route article{position:relative}.route article:before{content:'';position:absolute;left:-25px;top:24px;background:#648f75;width:12px;height:12px;border-radius:50%}
body{background:#f1efe6}main{padding-top:max(18px,env(safe-area-inset-top));max-width:760px}header{position:relative;overflow:hidden;background:radial-gradient(ellipse at 95% 0%,#527263 0%,transparent 60%),#18362d;padding:24px}header:after{content:'';position:absolute;right:-40px;bottom:-100px;width:240px;height:240px;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 20px #ffffff09,0 0 0 40px #ffffff09;pointer-events:none}header h1{font-size:34px}h2{font-size:19px;letter-spacing:.04em}article,.tile{padding:15px;border-radius:18px}article h3{margin:8px 0}p{margin:8px 0 14px}.tabs{position:sticky;top:env(safe-area-inset-top);z-index:3;background:#f1efe6;padding:7px 0;flex-wrap:nowrap;overflow:auto}.tabs button{white-space:nowrap;font-size:13px;padding:8px 11px}.panel{background:#19372e;color:#eee6d2;border-radius:22px;padding:18px;margin:12px 0}.panel small{color:#b9c9bd}.rings{display:block;width:100%;max-width:290px;margin:auto}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}.legend b{display:block;font-size:24px}.legend button{background:transparent;border:0;color:inherit;padding:4px}.cover{min-height:150px;background:linear-gradient(145deg,#1d4036,#779183);color:#fff5df;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:end;position:relative;overflow:hidden}.cover img{width:100%;height:210px;object-fit:cover;margin-bottom:12px}.cover small{color:#e4e9dc}.cover h3{font-size:23px;line-height:1.4}.route{padding-left:12px}.route article:before{left:-19px}.route article{padding:15px}.photo{width:100%;max-height:360px;object-fit:cover}.quiet{font-size:12px;padding:6px 10px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{font-size:12px;padding:5px 9px}.knowledge{border-left:4px solid var(--accent)}.knowledge summary{font-weight:600}.knowledge p{font-size:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats .tile{margin:0}.stats .num{font-size:27px}.eyebrow{font-size:11px;letter-spacing:2px;color:#77847a}.story{font-family:serif;font-size:17px;line-height:1.85}.route-strip{display:flex;gap:8px;overflow:auto;padding:8px 0}.route-strip span{white-space:nowrap;font-size:12px;background:#e4e9df;padding:5px 9px;border-radius:20px}nav{z-index:5}details>summary{padding:7px 0} .empty{padding:18px;text-align:center;color:#77847a} .cover button{align-self:start} .metric{font-size:12px;color:#77847a} 
 .tile.click{width:100%;text-align:left;cursor:pointer}.tile.click:after{content:'›';float:right}.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.mapbox{height:340px;border-radius:16px;overflow:hidden;background:#e1e9df}.crumb{margin:10px 0}.mapbox button{padding:4px}.leaflet-container{font:inherit} </style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><main><header><small>ATLAS OF LIFE / VOL. 02.1</small><h1>我的行迹</h1>以旅行丈量世界，以时间收藏记忆。<div id="hero"></div></header><div class="tabs" id="members"></div><div id="view"></div></main><nav id="nav"></nav><script>
const D=['自然','文明','生命','味觉'],M=JSON.parse(localStorage.getItem('atlas-member-labels')||'["我","孩子","伴侣"]'),C=['#648f75','#ba9561','#639ba5','#c17e68'];let db={version:1,trips:[]},filter='全部',page='首页';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let store;const req=indexedDB.open('world-atlas-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>{store=req.result;const q=store.transaction('data').objectStore('data').get('db');q.onsuccess=()=>{if(q.result)db=q.result;render()}};req.onerror=()=>{alert('本地存储不可用，请及时导出备份');render()};function save(){if(store){const t=store.transaction('data','readwrite');t.objectStore('data').put(db,'db');t.onerror=()=>alert('保存失败，请导出备份')}render()}
function selected(t,r){let m=r.members??t.members;return filter==='全部'||(filter==='一家三口'?M.every(x=>m.includes(x)):m.includes(filter))}function rows(){return db.trips.flatMap(t=>t.records.filter(r=>selected(t,r)).map(r=>({t,r})))}function tags(rs,d){return [...new Set(rs.flatMap(x=>x.r.tags).filter(x=>x.startsWith(d+':')).map(x=>x.split(':').slice(1).join(':')))]}function go(p){page=p;render();window.scrollTo(0,0)}function cleanNote(n){return String(n||'').replace(/除明确个人活动外暂继承专题成员[^。]*。/g,'').replace(/官方名录边界尚未核实。/g,'')}
function photo(r){return (r.photos||[]).filter(u=>/^data:image\//.test(u))}function coverPhoto(t){return t.records.filter(r=>selected(t,r)).flatMap(photo)[0]}function tripRows(t){return t.records.filter(r=>selected(t,r))}function tripVisible(t){return filter==='全部'||tripRows(t).length>0}function linkTrip(t){return encodeURIComponent(t.id)}
const K={
'高山环境':['海拔改变温度、水热条件与植被带，山地生态常呈垂直分异。','https://zh.wikipedia.org/wiki/高山气候'],
'峡谷':['河流下切与地壳抬升等过程可形成深切峡谷，地形也影响交通和聚落。','https://zh.wikipedia.org/wiki/峡谷'],
'河流':['河流连接流域中的生态、交通与人类聚落。','https://zh.wikipedia.org/wiki/河流'],
'雪山':['高山积雪与冰川受海拔、气候及地形影响；常年积雪不等于一定存在冰川。','https://zh.wikipedia.org/wiki/冰川'],
'高山湖泊':['高海拔湖泊可由冰川、构造等多种过程形成，具体成因须逐湖核实。','https://zh.wikipedia.org/wiki/湖泊'],
'南传佛教':['上座部佛教在斯里兰卡及东南亚多地流传，也见于中国云南部分民族地区。','https://zh.wikipedia.org/wiki/上座部佛教'],
'藏传佛教':['藏传佛教具有丰富的寺院、艺术、仪轨与哲学传统，可与其他佛教传统比较。','https://zh.wikipedia.org/wiki/藏传佛教'],
'森林生态':['森林是由植物、动物、真菌、微生物与非生物环境共同构成的生态系统。','https://zh.wikipedia.org/wiki/森林'],
'真菌':['真菌是独立于植物和动物的一类生物，在分解及共生关系中具有重要作用。','https://zh.wikipedia.org/wiki/真菌'],
'咖啡文化':['咖啡的风味受品种、产地、处理、烘焙与冲煮共同影响。','https://varieties.worldcoffeeresearch.org/'],
'传统聚落':['聚落的空间形态与地形、生产方式、交通及社会组织有关。','https://zh.wikipedia.org/wiki/聚落'],
'神山信仰':['自然山岳可以承载宗教信仰、地方认同与朝圣传统，具体意义因文化而异。','https://zh.wikipedia.org/wiki/圣山']};
function ring(rs){let ns=D.map(d=>tags(rs,d).length),total=ns.reduce((a,b)=>a+b,0);return `<div class="panel"><small>KNOWLEDGE ATLAS / 四维认知</small><svg class="rings" viewBox="0 0 260 235" aria-label="四维知识主题分布">${ns.map((n,i)=>{let r=98-i*18,l=2*Math.PI*r;return `<circle cx="130" cy="116" r="${r}" fill="none" stroke="${C[i]}" stroke-opacity=".2" stroke-width="10"/><circle cx="130" cy="116" r="${r}" fill="none" stroke="${C[i]}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${n?l*n/total:0} ${l+1}" transform="rotate(-90 130 116)"/>`}).join('')}<text x="130" y="115" fill="#eee6d2" text-anchor="middle" font-size="32">${total}</text><text x="130" y="133" fill="#b9c9bd" text-anchor="middle" font-size="10">知识主题</text></svg><div class="legend">${D.map((d,i)=>`<button onclick="openDimension(${i})"><b style="color:${C[i]}">${ns[i]}</b>${d}</button>`).join('')}</div><small>环长为各维度占全部主题的比例，并非完成率。</small></div>`}
function heritage(rs){let hs=[...new Set(rs.flatMap(x=>x.r.heritage||[]))];return `<div class="stats">${[['世界遗产',hs.filter(x=>/世遗|世界遗产|UNESCO/i.test(x)).length],['全国重点文保',hs.filter(x=>/国保|全国重点文物/.test(x)).length]].map(x=>`<button class="tile click" onclick="metricView('${x[0]}')"><span class="num">${x[1]}</span>${x[0]}</button>`).join('')}</div><p class="metric">仅统计已核实且带对应名录类别的记录；未核实不计入。</p>${hs.map(h=>`<span class="tag">${esc(h)}</span>`).join('')}`}
function render(){ $('members').innerHTML=['全部',...M,'一家三口'].map((x,i)=>`<button class="${filter===x?'active':''}" data-member="${i}">${esc(x)}</button>`).join('');$('members').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=['全部',...M,'一家三口'][+b.dataset.member];render()});$('nav').innerHTML=['首页','专题','图鉴','录入','管理'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}');window.scrollTo(0,0)">${x}</button>`).join('');let rs=rows(),v=$('view');$('hero').innerHTML=`<p>${esc(filter)} · ${db.trips.filter(tripVisible).length} 个旅行章节</p>`;if(page==='首页'){v.innerHTML=`<h2>世界足迹</h2><div class="subnav"><button onclick="go('地图')">地理地图 →</button><button onclick="go('成长')">成长档案 →</button></div><div class="stats">${[['到访地点',new Set(rs.map(x=>x.r.place)).size],['体验记录',rs.length],['旅行专题',db.trips.filter(tripVisible).length],['徒步记录',rs.filter(x=>x.r.activities.includes('徒步')).length]].map(x=>`<button class="tile click" onclick="metricView('${x[0]}')"><span class="num">${x[1]}</span>${x[0]}</button>`).join('')}</div>${ring(rs)}<h2>权威名录</h2>${heritage(rs)}<h2>人生章节</h2>${tripList(rs)}`;}else if(page==='专题'){v.innerHTML='<h2>人生章节 / EXPEDITIONS</h2>'+tripList(rs)}else if(page==='图鉴'){v.innerHTML=ring(rs)+`<div class="subnav">${D.map((d,i)=>`<button onclick="openDimension(${i})">${d}图鉴</button>`).join('')}<button onclick="metricView('体验记录')">体验图鉴</button><button onclick="metricView('世界遗产')">世界遗产</button><button onclick="metricView('全国重点文保')">国保</button></div><p class="muted">选择一个分类，集中查看知识及关联地点。</p>`}else if(page==='地图'){mapView(rs)}else if(page==='成长'){growth()}else if(page==='录入'){form()}else{v.innerHTML=`<h2>数据管理</h2><article><p>家庭成员昵称（仅保存在本机）</p><button onclick="renameMembers()">设置成员昵称</button></article><article><p>数据保存在当前浏览器 IndexedDB 中，不会自动同步。请定期备份。</p><button onclick="exportDB()">导出完整 JSON</button><p>导入 JSON（相同 ID 的专题将替换）</p><input type="file" accept=".json,application/json" onchange="importDB(this)"><p><button class="danger" onclick="if(confirm('清空本地全部数据？')){db.trips=[];save()}">清空本地数据</button></p></article>`}}

function recordCards(rr){return rr.map(({t,r})=>`<article><b>${esc(r.place)}</b><p class="metric">${esc(r.date||t.date)} · ${esc(t.title)}</p><p>${esc(r.note)}</p><button class="quiet" onclick="detail('${linkTrip(t)}','${encodeURIComponent(r.id)}')">查看体验 →</button></article>`).join('')||'<p class="empty">暂无记录</p>'}
function metricView(k){let rs=rows();if(k==='旅行专题')return go('专题');if(k==='到访地点')return go('地图');let h=k==='世界遗产'||k==='全国重点文保';let rr=h?rs.filter(x=>(x.r.heritage||[]).some(y=>k==='世界遗产'?/世遗|世界遗产|UNESCO/i.test(y):/国保|全国重点文物/.test(y))):k==='徒步记录'?rs.filter(x=>x.r.activities.includes('徒步')):rs; $('view').innerHTML=`<button class="quiet" onclick="go('首页')">← 首页</button><h2>${k}</h2>${h?'<p>仅展示已录入的名录关联，未加载完整官方清单。</p><p><a target="_blank" rel="noopener" href="'+(k==='世界遗产'?'https://whc.unesco.org/en/list/':'https://www.ncha.gov.cn/')+'">官方名录来源 ↗</a></p>':''}${recordCards(rr)}`;window.scrollTo(0,0)}
function openDimension(i,focus){if(i<0)return go('图鉴');page='图鉴';let rs=rows(),d=D[i];$('view').innerHTML=`<button class="quiet" onclick="go('图鉴')">← 全部图鉴</button><h2 style="color:${C[i]}">${d}认知</h2><div class="subnav">${D.map((x,j)=>`<button class="${i===j?'active':''}" onclick="openDimension(${j})">${x}</button>`).join('')}</div>${tags(rs,d).map(k=>{let rr=rs.filter(x=>x.r.tags.includes(d+':'+k)),info=K[k];return `<article class="knowledge" style="--accent:${C[i]}"><details ${focus===k?'open':''}><summary>${esc(k)} · ${new Set(rr.map(x=>x.r.place)).size} 个对象</summary>${info?`<p>${esc(info[0])}</p><a href="${esc(info[1])}" target="_blank" rel="noopener">知识参考 ↗</a>`:''}${recordCards(rr)}</details></article>`}).join('')||'<p>暂无记录</p>'}`;window.scrollTo(0,0)}
function mapView(rs){let places=[...new Set(rs.map(x=>x.r.place))];$('view').innerHTML=`<h2>地理足迹 · ${places.length} 个地点</h2><p class="metric">地图只显示已设置坐标的地点。坐标可在下方手动添加；底图需要联网。</p><div id="map" class="mapbox"></div><h2>地点清单</h2>${places.map((p,i)=>`<article><b>${esc(p)}</b><p class="metric">${db.coords?.[p]?'已定位':'待定位'}</p><button class="quiet" data-place="${i}">设置坐标</button><details><summary>关联体验</summary>${recordCards(rs.filter(x=>x.r.place===p))}</details></article>`).join('')}`;document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{let p=places[+b.dataset.place],v=prompt('输入纬度,经度（十进制度）',db.coords?.[p]?.join(',')||'');if(!v)return;let a=v.split(/[,，]/).map(Number);if(a.length!==2||!a.every(Number.isFinite)||Math.abs(a[0])>90||Math.abs(a[1])>180)return alert('坐标无效');(db.coords??={})[p]=a;save()});if(!window.L){$('map').textContent='地图组件加载失败，地点清单仍可使用';return}let m=L.map('map').setView([35,105],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(m);let pts=[];for(let p of places){let a=db.coords?.[p];if(a){pts.push(a);L.marker(a).addTo(m).bindPopup(esc(p))}}if(pts.length)m.fitBounds(pts,{padding:[25,25],maxZoom:10})}
function growth(){let rr=db.trips.flatMap(t=>t.records.filter(r=>(r.members??t.members).includes(M[1])).map(r=>({t,r}))).sort((a,b)=>String(a.r.date||a.t.date).localeCompare(String(b.r.date||b.t.date)));$('view').innerHTML=`<h2>${esc(M[1])}的世界</h2><div class="panel"><small>GROWING WITH THE WORLD</small><h2>${new Set(rr.map(x=>x.r.place)).size} 个探索地点</h2><p>${rr.length} 条真实体验 · ${rr.filter(x=>x.r.activities.includes('徒步')).length} 次徒步记录</p></div>${ring(rr)}<h2>成长时间轴</h2>${recordCards(rr)}`}

function tripList(rs){return db.trips.filter(tripVisible).map(t=>{let rr=tripRows(t),ph=coverPhoto(t);return `<article><div class="cover">${ph?`<img src="${esc(ph)}" alt="旅行封面">`:''}<small>EXPEDITION · ${esc(t.date)}</small><h3>${esc(t.title)}</h3><small>${esc(t.members.join(' · '))}</small></div><div class="route-strip">${[...new Set(rr.map(r=>r.place))].slice(0,8).map(p=>`<span>${esc(p)}</span>`).join('')}</div><p class="metric">${rr.length} 条体验 · ${new Set(rr.flatMap(r=>r.tags)).size} 个主题</p><p class="story">${esc(filter==='全部'||filter==='一家三口'?cleanNote(t.note):'查看该成员的实际旅行体验。')}</p><button class="primary" onclick="detail('${linkTrip(t)}')">阅读章节 →</button> <button class="quiet" onclick="editTrip('${linkTrip(t)}')">编辑</button></article>`}).join('')||'<p class="empty">你的世界，等待探索。</p>'}
function detail(id,rid){let t=db.trips.find(x=>x.id===decodeURIComponent(id));if(!t)return;page='专题';let rr=tripRows(t),ph=coverPhoto(t);$('view').innerHTML=`<p><button class="quiet" onclick="render()">← 返回专题</button></p><div class="cover">${ph?`<img src="${esc(ph)}">`:''}<small>${esc(t.date)} · EXPEDITION</small><h3>${esc(t.title)}</h3></div><p class="story">${esc(filter==='全部'||filter==='一家三口'?cleanNote(t.note):'该成员的旅行记录')}</p><div class="route-strip">${rr.map(r=>`<span>${esc(r.place)}</span>`).join('')}</div><p><button class="quiet" onclick="form('${id}')">＋ 添加体验</button> <button class="quiet" onclick="editTrip('${id}')">编辑专题</button></p><div class="route">${rr.map((r,i)=>`<article id="rec-${esc(r.id)}"><div class="eyebrow">CHAPTER ${String(i+1).padStart(2,'0')}</div><h3>${esc(r.place)}</h3><small>${esc((r.members??t.members).join(' · '))}</small>${photo(r).map(u=>`<img class="photo" src="${esc(u)}">`).join('')}<p class="story">${esc(r.note)}</p><div class="chips">${r.tags.map(k=>`<button data-tag="${esc(k)}" class="tag">${esc(k.split(':').slice(1).join(':'))}</button>`).join('')}${r.activities.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>${r.summary||r.links?.length?`<details open><summary>认识这里</summary><p>${esc(r.summary)}</p>${(r.links||[]).filter(u=>/^https?:\//i.test(u)).map(u=>`<p><a href="${esc(u)}" target="_blank" rel="noopener">参考资料 ↗</a></p>`).join('')}</details>`:''}<button class="quiet" onclick="form('${id}','${encodeURIComponent(r.id)}')">编辑 / 添加照片</button></article>`).join('')}</div><details><summary>原始记录与核实备注</summary><p>${esc(t.note)}</p></details>`;$('view').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let [d,k]=b.dataset.tag.split(':');openDimension(D.indexOf(d),k)});if(rid)document.getElementById('rec-'+decodeURIComponent(rid))?.scrollIntoView();else window.scrollTo(0,0)}
function checks(m){return M.map(x=>`<label style="display:inline-block;margin:8px"><input type="checkbox" name="member" value="${x}" ${m.includes(x)?'checked':''}> ${x}</label>`).join('')}function picked(){return [...document.querySelectorAll('[name=member]:checked')].map(x=>x.value)}function editTrip(id){let t=db.trips.find(x=>x.id===decodeURIComponent(id));$('view').innerHTML=`<h2>编辑专题</h2><input id="tt" value="${esc(t.title)}"><input id="dt" value="${esc(t.date)}"><textarea id="nt">${esc(t.note)}</textarea>${checks(t.members)}<p><button class="primary" id="st">保存</button></p>`;$('st').onclick=()=>{t.title=$('tt').value;t.date=$('dt').value;t.note=$('nt').value;t.members=picked();save();detail(id)}}
function form(id,rid){let t=db.trips.find(x=>x.id===decodeURIComponent(id||'')),r=t?.records.find(x=>x.id===decodeURIComponent(rid||''));$('view').innerHTML=`<h2>${r?'编辑体验':'新增旅行体验'}</h2><label>旅行专题</label><select id="trip"><option value="">新建专题</option>${db.trips.map(x=>`<option value="${esc(x.id)}" ${t===x?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label>新专题名称（仅新建时）</label><input id="tt"><label>日期</label><input id="dt" type="date" value="${esc(r?.date||'')}"><label>地点</label><input id="pl" value="${esc(r?.place)}"><label>参与成员</label>${checks(r?.members??t?.members??[])}<label>体验与感悟</label><textarea id="nt">${esc(r?.note)}</textarea><label>知识标签（逗号分隔，如 自然:雪山,文明:古道）</label><input id="tg" value="${esc(r?.tags.join(','))}"><label>活动（逗号分隔）</label><input id="ac" value="${esc(r?.activities.join(','))}"><label>百科摘要</label><textarea id="su">${esc(r?.summary)}</textarea><label>参考链接（每行一个）</label><textarea id="li">${esc(r?.links?.join('\n'))}</textarea><label>已核实官方名录（逗号分隔）</label><input id="he" value="${esc(r?.heritage?.join(','))}"><label>添加照片</label><input id="ph" type="file" accept="image/*" multiple><button class="primary" id="sv">保存记录</button>${r?'<button class="danger" id="del">删除体验</button>':''}`;if(r)$('del').onclick=()=>{if(confirm('删除该体验？')){t.records=t.records.filter(x=>x!==r);save();detail(id)}};$('sv').onclick=async()=>{if(!$('pl').value.trim())return alert('请输入地点');let dest=db.trips.find(x=>x.id===$('trip').value);if(!dest&&!$('tt').value.trim())return alert('请输入专题名称');let split=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);let photos=[...(r?.photos||[])];try{for(let f of $('ph').files)photos.push(await new Promise((ok,no)=>{let fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(f)}))}catch(e){return alert('照片读取失败')}if(!dest){dest={id:crypto.randomUUID?.()||String(Date.now()),title:$('tt').value,date:$('dt').value,members:picked(),note:'',records:[]};db.trips.push(dest)}let item={id:r?.id||crypto.randomUUID?.()||String(Date.now()),date:$('dt').value||r?.date||'',place:$('pl').value,note:$('nt').value,members:picked(),tags:split($('tg').value),activities:split($('ac').value),summary:$('su').value,links:$('li').value.split('\n').filter(Boolean),heritage:split($('he').value),photos};if(r&&dest===t){t.records[t.records.indexOf(r)]=item}else{if(r)t.records=t.records.filter(x=>x!==r);dest.records.push(item)}save();page='专题';render();detail(encodeURIComponent(dest.id))}}
function renameMembers(){let n=M.map(x=>prompt('设置成员昵称',x));if(n.some(x=>!x||!/^\p{L}{1,16}$/u.test(x))||new Set(n).size!==3||n.some(x=>['全部','一家三口'].includes(x)))return alert('请输入三个不同的纯文字昵称');let map=x=>n[M.indexOf(x)]||x;for(let t of db.trips){t.members=t.members.map(map);for(let r of t.records)if(r.members)r.members=r.members.map(map)}M.splice(0,3,...n);localStorage.setItem('atlas-member-labels',JSON.stringify(M));filter='全部';save()}function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,memberLabels:[...M]},null,2)],{type:'application/json'}));a.download='world-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importDB(el){try{let d=JSON.parse(await el.files[0].text());if(d.version!==1||!Array.isArray(d.trips)||!d.trips.every(t=>typeof t.id==='string'&&/^[\w-]+$/.test(t.id)&&typeof t.title==='string'&&Array.isArray(t.members)&&Array.isArray(t.records)&&t.records.every(r=>typeof r.id==='string'&&/^[\w-]+$/.test(r.id)&&typeof r.place==='string'&&['tags','activities','photos','links','heritage'].every(k=>Array.isArray(r[k])&&r[k].every(x=>typeof x==='string'))&&(r.members==null||Array.isArray(r.members)))))throw Error();if(!confirm('导入 '+d.trips.length+' 个专题？相同 ID 将替换。'))return;for(let t of d.trips){db.trips=db.trips.filter(x=>x.id!==t.id);db.trips.push(t)}save();alert('已导入')}catch(e){alert('文件格式不符合 V1 标准')}}render();</script></html>
